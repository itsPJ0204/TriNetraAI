server {
    listen 80;
    server_name localhost;

    # Use Docker internal DNS resolver (127.0.0.11) for deferred runtime name resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_target "http://backend:8000";

    # Serve static assets compiled by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and data endpoints to the FastAPI backend container
    location ~ ^/(search|detect-changes|archive|agent|data|outputs|tiles|tile-preview|available-dates|health|docs|openapi.json) {
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
